services:
  mongo:
    image: mongo:7
    volumes: ["mongo_data:/data/db"]
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
    ports: ["8000:8000"]
    depends_on: [mongo]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  mongo_data:
